<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رانا ہل کلائمب ریسنگ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 600px;
            margin: 0 auto;
            border: 4px solid #f39c12;
            background: #87CEEB; /* آسمان کا رنگ */
            box-shadow: 0 0 20px rgba(243, 156, 18, 0.5);
        }
        canvas {
            display: block;
        }
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 5px;
        }
        /* پیٹرول بار */
        #fuel-bar-container {
            position: absolute;
            top: 45px;
            left: 10px;
            right: 10px;
            height: 10px;
            background: #444;
            border-radius: 5px;
            border: 1px solid #fff;
        }
        #fuel-bar {
            width: 100%;
            height: 100%;
            background: #2ecc71;
            border-radius: 4px;
        }
        /* ڈرائیونگ کنٹرولز (ریس اور بریک) */
        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
        }
        .btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px #c0392b;
            flex: 1;
            margin: 0 5px;
        }
        .btn-gas {
            background: #2ecc71;
            box-shadow: 0 5px #27ae60;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px #27ae60;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="hud">
            <span id="score-text">سکے: 0</span>
            <span id="distance-text">فاصلہ: 0m</span>
        </div>
        <div id="fuel-bar-container">
            <div id="fuel-bar"></div>
        </div>

        <canvas id="gameCanvas" width="360" height="600"></canvas>

        <div class="controls">
            <button class="btn" id="brakeBtn">اُلٹا / بریک ◀</button>
            <button class="btn btn-gas" id="gasBtn">ریس (Gas) ▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let distance = 0;
        let fuel = 100;
        let cameraX = 0;

        // گاڑی کی پوزیشن اور فزکس
        let car = {
            x: 50,
            y: 400,
            vx: 0,
            vy: 0,
            angle: 0,
            width: 50,
            height: 25,
            power: 0.2,
            gravity: 0.3
        };

        let isGasPressed = false;
        let isBrakePressed = false;

        // بٹن کے کنٹرولز
        document.getElementById("gasBtn").addEventListener("touchstart", () => { isGasPressed = true; });
        document.getElementById("gasBtn").addEventListener("touchend", () => { isGasPressed = false; });
        document.getElementById("gasBtn").addEventListener("mousedown", () => { isGasPressed = true; });
        document.getElementById("gasBtn").addEventListener("mouseup", () => { isGasPressed = false; });

        document.getElementById("brakeBtn").addEventListener("touchstart", () => { isBrakePressed = true; });
        document.getElementById("brakeBtn").addEventListener("touchend", () => { isBrakePressed = false; });
        document.getElementById("brakeBtn").addEventListener("mousedown", () => { isBrakePressed = true; });
        document.getElementById("brakeBtn").addEventListener("mouseup", () => { isBrakePressed = false; });

        // پہاڑی راستے کا فنکشن (Terrain)
        function getTerrainHeight(x) {
            // سائن ویو کے ذریعے اونچے نیچے پہاڑ بنانا
            return 450 + Math.sin(x * 0.005) * 80 + Math.sin(x * 0.02) * 30;
        }

        function update() {
            // پیٹرول کم ہونا
            if (isGasPressed && fuel > 0) {
                car.vx += car.power;
                fuel -= 0.05;
                document.getElementById("fuel-bar").style.width = fuel + "%";
            }

            if (isBrakePressed) {
                car.vx -= car.power * 0.8;
            }

            // کششِ ثقل (Gravity) اور فزکس
            car.vy += car.gravity;
            car.vx *= 0.98; // رگڑ (Friction)

            car.x += car.vx;
            car.y += car.vy;

            // زمین کے ساتھ ٹکر اور پہاڑ پر چلنا
            let groundY = getTerrainHeight(car.x);
            if (car.y > groundY - car.height) {
                car.y = groundY - car.height;
                car.vy = 0;

                // پہاڑ کے ڈھلوان کے حساب سے گاڑی کا زاویہ (Angle) بدلنا
                let nextGroundY = getTerrainHeight(car.x + 10);
                car.angle = Math.atan2(nextGroundY - groundY, 10);
            } else {
                // ہوا میں گاڑی کا زاویہ گھمانا اگر ریس یا بریک دبائی جائے
                if (isGasPressed) car.angle += 0.03;
                if (isBrakePressed) car.angle -= 0.03;
            }

            // کیمرہ گاڑی کے ساتھ آگے چلنا
            cameraX = car.x - 80;
            distance = Math.floor(car.x / 10);
            document.getElementById("distance-text").innerText = "فاصلہ: " + distance + "m";

            // پیٹرول ختم یا الٹنے پر گیم اوور
            if (fuel <= 0 || (car.angle > 1.5 || car.angle < -1.5)) {
                alert("گیم اوور! آپ کا فاصلہ: " + distance + "m");
                location.reload();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // پہاڑ/زمین ڈرا کرنا
            ctx.fillStyle = "#27ae60"; // زمین کا رنگ
            ctx.beginPath();
            ctx.moveTo(cameraX, canvas.height);
            for (let x = cameraX; x < cameraX + canvas.width + 50; x += 10) {
                ctx.lineTo(x, getTerrainHeight(x));
            }
            ctx.lineTo(cameraX + canvas.width + 50, canvas.height);
            ctx.fill();

            // گاڑی ڈرا کرنا
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);

            // گاڑی کی باڈی
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(-car.width/2, -car.height, car.width, car.height);
            // چھت
            ctx.fillStyle = "#c0392b";
            ctx.fillRect(-10, -car.height - 15, 25, 15);

            // ٹائر
            ctx.fillStyle = "#2c3e50";
            ctx.beginPath();
            ctx.arc(-15, 0, 8, 0, Math.PI * 2);
            ctx.arc(15, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
