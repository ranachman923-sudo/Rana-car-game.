<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok HD Downloader</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 15px; border-radius: 8px; border: none; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; background: #0284c7; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .dl-btn { display: block; width: 100%; padding: 15px; background: #22c55e; color: white; text-decoration: none; border-radius: 8px; margin-top: 15px; font-weight: bold; }
        #loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #0284c7; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h2>TikTok Video Downloader</h2>
    <input type="text" id="url" placeholder="ٹک ٹاک ویڈیو لنک یہاں پیسٹ کریں...">
    <button onclick="downloadVideo()">ڈاؤنلوڈ کریں</button>
    <div id="loader"></div>
    <div id="result"></div>
</div>

<script>
async function downloadVideo() {
    const url = document.getElementById('url').value;
    const result = document.getElementById('result');
    const loader = document.getElementById('loader');

    if (!url) { alert("پہلے لنک پیسٹ کریں!"); return; }
    
    loader.style.display = 'block';
    result.innerHTML = '';

    const apiKey = 'f6687ea3c6msh93374c9f6b03057p130d0jsn04932b1d5037'; // آپ کی اپنی Key

    try {
        const response = await fetch(`https://tikwm.p.rapidapi.com/?url=${encodeURIComponent(url)}`, {
            method: 'GET',
            headers: {
                'x-rapidapi-key': apiKey,
                'x-rapidapi-host': 'tikwm.p.rapidapi.com'
            }
        });
        const data = await response.json();
        loader.style.display = 'none';

        if (data.code === 0) {
            result.innerHTML = `<a href="${data.data.play}" class="dl-btn" target="_blank" download>ویڈیو ڈاؤنلوڈ کریں</a>`;
        } else {
            result.innerHTML = '<p style="color:red;">لنک غلط ہے یا ویڈیو نہیں مل سکی۔</p>';
        }
    } catch (err) {
        loader.style.display = 'none';
        result.innerHTML = '<p style="color:red;">کچھ مسئلہ ہوا، دوبارہ کوشش کریں۔</p>';
    }
}
</script>
</body>
</html>
