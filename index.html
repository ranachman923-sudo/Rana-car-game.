<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Jungle Endless Runner</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0,0,0,0.8); padding: 30px; text-align: center; border-radius: 10px; }
        #restart-btn { padding: 10px 20px; font-size: 18px; margin-top: 15px; cursor: pointer; background: #ff9800; border: none; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span></div>
    <div id="game-over">
        <h1>Game Over!</h1>
        <p>Your Score: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="restartGame()">Play Again</button>
    </div>

    <!-- Three.js Library for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player;
        let score = 0, speed = 0.4, isGameOver = false;
        let currentLane = 0; // -1: Left, 0: Middle, 1: Right
        const laneWidth = 3;
        let obstacles = [], groundTiles = [];

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x228b22); // Forest Green Background
            scene.fog = new THREE.Fog(0x228b22, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4, -8);
            camera.lookAt(0, 1, 10);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(0, 20, -10);
            scene.add(dirLight);

            // Player (Hero Mesh)
            const geometry = new THREE.BoxGeometry(1, 2, 1);
            const material = new THREE.MeshLambertMaterial({ color: 0xffd700 }); // Gold Color
            player = new THREE.Mesh(geometry, material);
            player.position.set(0, 1, 0);
            scene.add(player);

            // Generate Initial Path
            for (let i = 0; i < 10; i++) {
                createGroundTile(i * 20);
            }

            // Controls
            document.addEventListener('keydown', handleInput);

            animate();
        }

        function createGroundTile(zPos) {
            const geo = new THREE.BoxGeometry(10, 0.2, 20);
            const mat = new THREE.MeshLambertMaterial({ color: 0x8b4513 }); // Mud/Jungle Path
            const tile = new THREE.Mesh(geo, mat);
            tile.position.set(0, 0, zPos);
            scene.add(tile);
            groundTiles.push(tile);

            // Spawn Obstacle
            if (zPos > 20 && Math.random() > 0.4) {
                createObstacle(zPos);
            }
        }

        function createObstacle(zPos) {
            const lanes = [-laneWidth, 0, laneWidth];
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            
            const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const mat = new THREE.MeshLambertMaterial({ color: 0xff0000 }); // Red Obstacle
            const obstacle = new THREE.Mesh(geo, mat);
            obstacle.position.set(randomLane, 0.75, zPos);
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function handleInput(e) {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > -1) {
                currentLane--;
            } else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 1) {
                currentLane++;
            }
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            // Move Player Smoothly to Target Lane
            const targetX = currentLane * laneWidth;
            player.position.x += (targetX - player.position.x) * 0.2;

            // Move Environment towards Camera (Endless Loop)
            groundTiles.forEach(tile => {
                tile.position.z -= speed;
                if (tile.position.z < -20) {
                    tile.position.z += 200;
                }
            });

            // Move Obstacles & Check Collisions
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z -= speed;

                // Collision Detection
                const pBox = new THREE.Box3().setFromObject(player);
                const oBox = new THREE.Box3().setFromObject(obs);

                if (pBox.intersectsBox(oBox)) {
                    gameOver();
                }

                // Remove Passed Obstacles
                if (obs.position.z < -10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }

            // Spawn New Obstacles Continuously
            if (obstacles.length < 5) {
                createObstacle(player.position.z + 150);
            }

            renderer.render(scene, camera);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            location.reload();
        }

        window.onload = init;
    </script>
</body>
</html>
